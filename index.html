<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sky Sensor Test</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #05060a;
    color: #e8ecf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #canvas-wrap {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(5,6,10,0.9), rgba(5,6,10,0));
    font-size: 13px;
    line-height: 1.5;
    z-index: 10;
    pointer-events: none;
  }
  #hud .row {
    display: flex;
    justify-content: space-between;
    color: #9aa4b2;
  }
  #hud .row b {
    color: #e8ecf1;
    font-variant-numeric: tabular-nums;
  }
  #status {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px;
    background: linear-gradient(0deg, rgba(5,6,10,0.95), rgba(5,6,10,0));
    z-index: 10;
  }
  #msg {
    font-size: 14px;
    color: #9aa4b2;
    margin-bottom: 10px;
    min-height: 40px;
  }
  #msg.found {
    color: #ffd27a;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #3a5cff;
    color: white;
    font-size: 15px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    background: #2c47d1;
  }
  #err {
    position: fixed;
    inset: 0;
    background: #05060a;
    z-index: 20;
    display: none;
    padding: 24px;
    font-size: 15px;
    line-height: 1.6;
  }
  #err.show { display: block; }
  #err h2 { color: #ff8080; margin-top: 0; }
  #err code {
    background: #14161c;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="sky"></canvas>
</div>

<div id="hud">
  <div class="row"><span>Heading</span><b id="hud-heading">--°</b></div>
  <div class="row"><span>Tilt (altitude)</span><b id="hud-tilt">--°</b></div>
  <div class="row"><span>Roll</span><b id="hud-roll">--°</b></div>
  <div class="row"><span>Lat / Long</span><b id="hud-latlong">--</b></div>
  <div class="row"><span>Debug</span><b id="hud-debug" style="font-size:11px">--</b></div>
  <div class="row"><b id="hud-gimbal" style="color:#ffb347"></b></div>
</div>

<div id="status">
  <div id="msg">Tap start, then point your phone at the sky.</div>
  <button id="start-btn">Start sensors</button>
</div>

<div id="err">
  <h2>Couldn't start</h2>
  <p id="err-text"></p>
  <p>This test needs to run over <code>https://</code> (or <code>localhost</code>) for the compass and GPS to be available — plain <code>http://</code> on a local IP won't work on most phones.</p>
</div>

<script>
/*
  SKY SENSOR TEST — real 3D perspective projection
  ----------------------------------------------------------------
  Previous version mapped stars to screen space by just subtracting
  azimuth/altitude and scaling linearly — a flat approximation that
  distorted badly near the zenith and ignored phone roll entirely.

  This version projects properly:
  1. altAzToWorldVector — star alt/az -> 3D unit vector (East-North-Up)
  2. worldToCameraSpace — rotate that vector by heading (yaw), tilt
     (pitch), AND roll (twist), using real 3D rotation, not angle
     subtraction
  3. projectToScreen — pinhole-camera perspective projection (tan-based
     focal length), the same math real cameras/game engines use

  Constellation RA/Dec data is unchanged — only the projection path
  from "computed alt/az" to "screen pixel" was rebuilt.

  Still NO camera feed — blank canvas so the sensor + astronomy math
  can be verified on its own before adding AR video.
*/

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = window.innerWidth * window.devicePixelRatio;
  canvas.height = window.innerHeight * window.devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Assumed camera field of view (degrees) — phone cameras are
// typically ~60-70° horizontal. We'll refine this later against
// the real camera feed; for now it just sets how "zoomed in" the
// blank-canvas test feels.
const FOV_H = 65;
const FOV_V = 65 * (window.innerHeight / window.innerWidth);

// --- Constellations ---
// RA/Dec in degrees (J2000 epoch — fixed, doesn't change with time).
// `links` defines which stars connect to which, by index into `stars`.
const CONSTELLATIONS = [
  {
    name: 'Orion\'s Belt',
    color: '#ffd27a',
    stars: [
      { name: 'Mintaka',  ra: 83.00,  dec: -0.30 },
      { name: 'Alnilam',  ra: 84.05,  dec: -1.20 },
      { name: 'Alnitak',  ra: 85.19,  dec: -1.94 },
    ],
    links: [[0, 1], [1, 2]],
  },
  {
    name: 'Big Dipper (Ursa Major)',
    color: '#8ad4ff',
    // Circumpolar from UK latitudes (~50°N+) — never sets below the
    // horizon, so this should be findable any time, any season,
    // unlike Crux which never rises there at all.
    stars: [
      { name: 'Dubhe',   ra: 165.93, dec: 61.75 },
      { name: 'Merak',   ra: 165.46, dec: 56.38 },
      { name: 'Phecda',  ra: 178.46, dec: 53.69 },
      { name: 'Megrez',  ra: 183.86, dec: 57.03 },
      { name: 'Alioth',  ra: 193.51, dec: 55.96 },
      { name: 'Mizar',   ra: 200.98, dec: 54.93 },
      { name: 'Alkaid',  ra: 206.89, dec: 49.31 },
    ],
    // Bowl: Dubhe-Merak-Phecda-Megrez-Dubhe, handle: Megrez-Alioth-Mizar-Alkaid
    links: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]],
  },
];

let state = {
  heading: null,   // compass azimuth, degrees, 0 = North (smoothed)
  tiltAlt: null,   // device tilt converted to altitude, degrees above horizon (smoothed)
  roll: 0,         // device roll/twist around its own pointing axis, degrees (smoothed)
  lat: null,
  lon: null,
};

// Smoothing factor: lower = smoother but laggier, higher = snappier but jumpier.
const SMOOTHING = 0.15;
// Hard cap on how far a value is allowed to move in a single frame,
// regardless of how large the raw sensor jump was. Compass readings
// in particular can spike briefly (magnetic interference, indoors,
// near metal) — without this cap, smoothing still drags the value
// toward that bad spike and it reads as a sudden snap. This caps the
// worst case to a steady, fast-but-bounded motion instead.
const MAX_STEP_PER_FRAME = 6; // degrees

// Smooths an angle that wraps at 0/360 (compass heading) without
// glitching at the wrap point — e.g. going from 359° to 1° should
// smooth through 360°, not snap backward through 180°.
function smoothAngle(current, target, factor, damping) {
  if (current === null) return target;
  damping = damping === undefined ? 1 : damping;
  let diff = angDiff(target, current); // shortest signed distance, handles wrap
  let step = diff * factor * damping;
  const maxStep = MAX_STEP_PER_FRAME * damping;
  step = Math.max(-maxStep, Math.min(maxStep, step));
  return ((current + step) % 360 + 360) % 360;
}

function smoothLinear(current, target, factor, damping) {
  if (current === null) return target;
  damping = damping === undefined ? 1 : damping;
  let step = (target - current) * factor * damping;
  const maxStep = MAX_STEP_PER_FRAME * damping;
  step = Math.max(-maxStep, Math.min(maxStep, step));
  return current + step;
}

// The phone's raw orientation sensors (alpha/beta/gamma) suffer from
// "gimbal lock": when tilt is near 0° (pointing near the horizon,
// beta near 90°), heading and roll become mathematically coupled and
// tiny real movements get misread as huge swings in either value.
// This isn't a bug we introduced — it's inherent to how these Euler
// angles work. The fix: fade responsiveness toward 0 as tilt
// approaches the unstable zone, so noise gets suppressed exactly
// where the sensor is least trustworthy, without affecting normal use.
const GIMBAL_ZONE_DEG = 20; // within this many degrees of tilt=0, damping kicks in
function gimbalDamping(tiltDeg) {
  const t = Math.min(1, Math.abs(tiltDeg) / GIMBAL_ZONE_DEG);
  return t * t * (3 - 2 * t); // smoothstep: 0 at tilt=0, 1 by tilt=±20°
}

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

// Julian Date from a JS Date, needed for sidereal time
function julianDate(date) {
  return (date.getTime() / 86400000) + 2440587.5;
}

// Greenwich Mean Sidereal Time, in degrees
function gmst(date) {
  const jd = julianDate(date);
  const T = (jd - 2451545.0) / 36525.0;
  let gmstDeg = 280.46061837
    + 360.98564736629 * (jd - 2451545.0)
    + 0.000387933 * T * T
    - (T * T * T) / 38710000.0;
  gmstDeg = ((gmstDeg % 360) + 360) % 360;
  return gmstDeg;
}

// Local Sidereal Time, in degrees
function lst(date, lonDeg) {
  return ((gmst(date) + lonDeg) % 360 + 360) % 360;
}

// Convert RA/Dec + observer lat/long/time -> Altitude/Azimuth
function equatorialToHorizontal(raDeg, decDeg, latDeg, lonDeg, date) {
  const localSiderealDeg = lst(date, lonDeg);
  let haDeg = localSiderealDeg - raDeg;
  haDeg = ((haDeg % 360) + 360) % 360;

  const ha = toRad(haDeg);
  const dec = toRad(decDeg);
  const lat = toRad(latDeg);

  const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
  const alt = Math.asin(sinAlt);

  const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
  let az = Math.acos(Math.min(1, Math.max(-1, cosAz)));
  az = toDeg(az);

  // acos gives 0-180, need to determine which half of the circle
  if (Math.sin(ha) > 0) {
    az = 360 - az;
  }

  return { alt: toDeg(alt), az: az };
}

// Shortest signed angular difference, handling the 0/360 wraparound
function angDiff(a, b) {
  let d = ((a - b + 540) % 360) - 180;
  return d;
}

// --- 3D perspective projection ---
// This replaces the old "just subtract angles and scale linearly"
// approach. That flat method treated every degree of azimuth as the
// same number of pixels everywhere on screen, which is wrong — the
// sky is a sphere, not a flat grid, so objects near the zenith swing
// sideways much faster (in screen terms) for the same azimuth change
// than objects near the horizon do. It also had no way to represent
// the phone being twisted/rolled. This section fixes both.

// Convert a star's altitude/azimuth into a 3D unit vector in an
// East-North-Up (ENU) "world" coordinate frame. This is just standard
// spherical-to-Cartesian conversion — altitude/azimuth describe a
// point on the sky-sphere the same way latitude/longitude describe a
// point on Earth's surface.
function altAzToWorldVector(altDeg, azDeg) {
  const alt = toRad(altDeg), az = toRad(azDeg);
  return {
    e: Math.cos(alt) * Math.sin(az), // East component
    n: Math.cos(alt) * Math.cos(az), // North component
    u: Math.sin(alt),                // Up component
  };
}

// Rotate a world-frame star vector into camera-relative space using
// the phone's current heading (yaw), tilt (pitch), and roll — applied
// as three sequential axis rotations, which together form a full 3D
// rotation matrix. This is the core fix: instead of subtracting
// angles, we actually rotate the star's 3D position to match where
// the camera is currently pointing, the same way a flight simulator
// or game camera works.
function worldToCameraSpace(v, headingDeg, tiltDeg, rollDeg) {
  const h = toRad(headingDeg);
  const t = toRad(tiltDeg);
  const r = toRad(rollDeg);

  // 1) YAW: rotate around the Up axis by heading, so the camera's
  //    level pointing direction becomes the new "forward" axis.
  const R0 = v.e * Math.cos(h) - v.n * Math.sin(h); // right-ish axis
  const F0 = v.e * Math.sin(h) + v.n * Math.cos(h); // forward-ish axis
  const U0 = v.u;

  // 2) PITCH: rotate around the (now-aligned) right axis by tilt, so
  //    the camera's actual up/down aim becomes the new "forward" axis.
  const F1 = F0 * Math.cos(t) + U0 * Math.sin(t);
  const U1 = -F0 * Math.sin(t) + U0 * Math.cos(t);
  const R1 = R0;

  // 3) ROLL: rotate around the forward axis by roll, accounting for
  //    the phone being twisted along the direction it's pointing.
  const R2 = R1 * Math.cos(r) - U1 * Math.sin(r);
  const U2 = R1 * Math.sin(r) + U1 * Math.cos(r);
  const F2 = F1;

  return { right: R2, up: U2, forward: F2 };
}

// Standard pinhole-camera perspective projection: given a point in
// camera space and the canvas size, work out where it lands on
// screen. Using tan()-based focal length (rather than a linear
// degree-to-pixel scale) is what correctly reproduces real camera/eye
// perspective — objects near the edge of the FOV appear to move
// faster on screen than objects near the center, just like reality.
function projectToScreen(camVec, canvasW, canvasH, fovHDeg, fovVDeg) {
  if (camVec.forward <= 0) {
    // Point is behind the camera — nothing to draw.
    return { inView: false };
  }
  const focalX = (canvasW / 2) / Math.tan(toRad(fovHDeg) / 2);
  const focalY = (canvasH / 2) / Math.tan(toRad(fovVDeg) / 2);

  const screenX = canvasW / 2 + (camVec.right / camVec.forward) * focalX;
  const screenY = canvasH / 2 - (camVec.up / camVec.forward) * focalY;

  // Normalized distance from center, 0 = center, 1 = exactly at the
  // canvas edge. Used to fade points out smoothly near the boundary
  // instead of a hard cut, which is what made things look like they
  // were snapping in/out abruptly.
  const nx = Math.abs(screenX - canvasW / 2) / (canvasW / 2);
  const ny = Math.abs(screenY - canvasH / 2) / (canvasH / 2);
  const edgeDist = Math.max(nx, ny);

  const inView = edgeDist <= 1.15; // small margin so fade has room to complete
  return { x: screenX, y: screenY, inView, edgeDist };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = window.innerWidth, h = window.innerHeight;

  // faint horizon reference grid, purely visual
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(0, (h / 4) * i);
    ctx.lineTo(w, (h / 4) * i);
    ctx.stroke();
  }

  const msgEl = document.getElementById('msg');

  if (state.heading === null || state.lat === null) {
    return;
  }

  const now = new Date();
  const visibleNames = [];
  const debugLines = [];

  CONSTELLATIONS.forEach(constellation => {
    // Compute alt/az for every star in this constellation first.
    const computed = constellation.stars.map(star =>
      equatorialToHorizontal(star.ra, star.dec, state.lat, state.lon, now)
    );

    const alts = computed.map(p => p.alt);
    debugLines.push(constellation.name + ': alt ' + Math.min(...alts).toFixed(0) + '° to ' + Math.max(...alts).toFixed(0) + '°');

    // Only consider this constellation "above the horizon" if ALL
    // its stars are — a partially-risen constellation would look
    // broken/cut-off, so we treat it as not-yet-visible.
    const allAboveHorizon = computed.every(pos => pos.alt >= 0);
    if (!allAboveHorizon) return;

    // Project each star to screen space using the real 3D pipeline:
    // alt/az -> world vector -> rotate into camera space (yaw, pitch,
    // roll) -> perspective-project onto the screen.
    const screenPts = computed.map((pos, i) => {
      const worldVec = altAzToWorldVector(pos.alt, pos.az);
      const camVec = worldToCameraSpace(worldVec, state.heading, state.tiltAlt, state.roll);
      const proj = projectToScreen(camVec, w, h, FOV_H, FOV_V);
      // fade smoothly from full opacity at center to 0 at the margin
      const alpha = proj.inView ? Math.max(0, 1 - Math.max(0, (proj.edgeDist - 0.85) / 0.3)) : 0;
      return {
        x: proj.x,
        y: proj.y,
        inView: proj.inView && alpha > 0.02,
        alpha,
        name: constellation.stars[i].name,
      };
    });

    // If none of this constellation's stars are currently in the
    // camera's FOV, nothing to draw for it right now (even though
    // it IS above the horizon somewhere in the sky).
    if (!screenPts.some(p => p.inView)) return;

    visibleNames.push(constellation.name);

    // Draw connecting lines first (so stars sit on top)
    ctx.lineWidth = 1.5;
    constellation.links.forEach(([a, b]) => {
      const pa = screenPts[a], pb = screenPts[b];
      // draw the link if at least one endpoint is in view, so lines
      // don't vanish the instant one star drifts just off-screen
      if (pa.inView || pb.inView) {
        const lineAlpha = Math.max(pa.alpha, pb.alpha) * 0.5;
        ctx.strokeStyle = constellation.color + Math.round(lineAlpha * 255).toString(16).padStart(2, '0');
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }
    });

    // Draw each star that's actually in view, faded near the edge
    screenPts.forEach(p => {
      if (!p.inView) return;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = constellation.color;
      ctx.shadowColor = constellation.color;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(p.name, p.x + 10, p.y + 4);
      ctx.globalAlpha = 1;
    });
  });

  if (visibleNames.length > 0) {
    msgEl.textContent = visibleNames.join(' and ') + ' in view — pan away and it should disappear.';
    msgEl.classList.add('found');
  } else {
    msgEl.textContent = 'Not in view right now. Slowly pan around the sky.';
    msgEl.classList.remove('found');
  }

  document.getElementById('hud-debug').textContent = debugLines.join(' | ');
}

function updateHud() {
  document.getElementById('hud-heading').textContent =
    state.heading !== null ? state.heading.toFixed(1) + '°' : '--°';
  document.getElementById('hud-tilt').textContent =
    state.tiltAlt !== null ? state.tiltAlt.toFixed(1) + '°' : '--°';
  document.getElementById('hud-roll').textContent = state.roll.toFixed(1) + '°';
  document.getElementById('hud-latlong').textContent =
    state.lat !== null ? state.lat.toFixed(3) + ', ' + state.lon.toFixed(3) : '--';
  const gimbalNote = document.getElementById('hud-gimbal');
  if (gimbalNote) {
    const d = gimbalDamping(state.tiltAlt || 0);
    gimbalNote.textContent = d < 0.9 ? '⚠ near horizon — tilt up more for stable tracking' : '';
  }
}

function loop() {
  updateHud();
  draw();
  requestAnimationFrame(loop);
}

function handleOrientation(event) {
  // iOS gives a direct compass heading; Android needs alpha + absolute check.
  let heading;
  if (typeof event.webkitCompassHeading === 'number') {
    heading = event.webkitCompassHeading; // iOS: already 0=North, clockwise
  } else if (event.alpha !== null) {
    heading = 360 - event.alpha; // Android approximation, often needs calibration
  } else {
    return;
  }

  const rawHeading = ((heading % 360) + 360) % 360;
  // Heading stays partly responsive even in the unstable zone (it's
  // less severely affected than roll), roll gets damped all the way
  // toward frozen right at tilt=0 where it's most unreliable.
  const damping = gimbalDamping(state.tiltAlt || 0);
  state.heading = smoothAngle(state.heading, rawHeading, SMOOTHING, 0.4 + 0.6 * damping);

  // beta: front-back tilt, -180 to 180, 0 = flat, 90 = upright pointing at horizon
  // Convert "phone held upright, pointed at sky" tilt into altitude degrees.
  if (event.beta !== null) {
    // when beta ~90 (phone vertical, screen facing you), treat as pointing at horizon (alt 0)
    // tilting top of phone further back/up increases altitude
    const rawTiltAlt = event.beta - 90;
    state.tiltAlt = smoothLinear(state.tiltAlt, rawTiltAlt, SMOOTHING);
  }

  // gamma: left-right tilt, -90 to 90. When the phone is held roughly
  // upright and pointed outward (the way this app expects to be used),
  // gamma approximates how much the phone is twisted/rolled around its
  // own pointing axis — e.g. tipping the top edge left or right while
  // still aiming at the same spot in the sky. This is an approximation
  // that assumes portrait orientation; it isn't a fully general roll
  // solution for every possible way of holding the phone.
  if (event.gamma !== null) {
    state.roll = smoothLinear(state.roll, event.gamma, SMOOTHING, damping);
  }
}

function handleError(text) {
  document.getElementById('err-text').textContent = text;
  document.getElementById('err').classList.add('show');
}

document.getElementById('start-btn').addEventListener('click', async () => {
  // Geolocation
  if (!navigator.geolocation) {
    handleError('Geolocation is not available in this browser.');
    return;
  }
  navigator.geolocation.watchPosition(
    pos => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      document.getElementById('hud-latlong').style.color = '';
    },
    err => {
      document.getElementById('hud-latlong').textContent = 'FAILED: ' + err.message;
      document.getElementById('hud-latlong').style.color = '#ff8080';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );

  // DeviceOrientation — iOS 13+ requires an explicit permission prompt
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') {
        handleError('Motion & orientation permission was not granted.');
        return;
      }
    } catch (e) {
      handleError('Could not request orientation permission: ' + e.message);
      return;
    }
  }

  window.addEventListener('deviceorientation', handleOrientation, true);
  document.getElementById('start-btn').textContent = 'Sensors running';
  document.getElementById('start-btn').disabled = true;

  loop();
});
</script>

</body>
</html>
